<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Объявления</title>
  <style>
    :root{--bg:#f5f6f8;--panel:#fff;--text:#17202a;--muted:#667789;--line:#dde5ee;--accent:#0f6fde;--green:#16825d;--amber:#a15c00;--red:#b42318;--shadow:0 10px 24px rgba(26,39,58,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;line-height:1.45}
    header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.head{max-width:1440px;margin:0 auto;padding:20px 24px;display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
    h1{margin:0 0 6px;font-size:28px;letter-spacing:0}.lead{margin:0;color:var(--muted)}.adminLink{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:8px;background:var(--text);color:#fff;text-decoration:none;font-weight:800;white-space:nowrap}
    main{max-width:1440px;margin:0 auto;padding:18px 24px 36px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:#334155}
    .toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 180px 220px;gap:10px;margin-bottom:14px}.toolbar input,.toolbar select{height:42px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);padding:0 12px}
    .tableShell{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:auto}table{border-collapse:separate;border-spacing:0;width:100%;min-width:1180px}th,td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}th{font-size:11px;text-transform:uppercase;color:#52606d;background:#f9fbfd;position:sticky;top:79px;z-index:2}tbody tr:hover{background:#fbfdff}tbody tr:last-child td{border-bottom:0}
    .title{font-weight:800}.muted{display:block;color:var(--muted);font-size:12px;margin-top:4px}.money{font-weight:800;white-space:nowrap}.grade{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;color:#fff;font-weight:800;background:var(--accent)}.grade.A{background:var(--green)}.grade.B{background:var(--accent)}.grade.C{background:var(--amber)}.grade.D,.grade.X{background:var(--red)}
    .openBtn{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 12px;border-radius:7px;background:var(--accent);color:#fff;text-decoration:none;font-weight:800}.empty{background:#fff;border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted)}
    @media(max-width:860px){header{position:static}.head{display:block;padding:18px 14px}.adminLink{margin-top:14px}.toolbar{grid-template-columns:1fr}main{padding:12px 10px 28px}.tableShell{border:0;background:transparent;box-shadow:none;overflow:visible}table,thead,tbody,tr,th,td{display:block}table{min-width:0}thead{display:none}tbody{display:grid;gap:12px}tr{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:12px}td{border:0;padding:8px 0;display:grid;grid-template-columns:118px 1fr;gap:10px}td:before{content:attr(data-label);color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase}.openBtn{width:100%}}
  </style>
</head>
<body>
  <header>
    <div class="head">
      <div>
        <h1>Объявления</h1>
        <p class="lead">Список объектов загружается из базы сайта. Данные можно обновить в панели управления.</p>
      </div>
      <a class="adminLink" href="/admin">Панель управления</a>
    </div>
  </header>

  <main>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <input id="q" placeholder="Поиск: адрес, метро, описание">
      <select id="grade">
        <option value="">Все оценки</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="X">X</option>
      </select>
      <select id="sort">
        <option value="default">Как в файле</option>
        <option value="total">Дешевле всего</option>
        <option value="monthly">Дешевле в месяц</option>
        <option value="score">Лучший рейтинг</option>
      </select>
    </div>

    <section class="tableShell" id="tableShell">
      <table>
        <thead>
          <tr>
            <th>#</th><th>Оценка</th><th>Объект</th><th>Цена</th><th>Залог</th><th>Комиссия</th><th>ЖКУ</th><th>Дорога</th><th>Комментарий</th><th>Ссылка</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
    <div class="empty" id="empty" hidden>Пока нет объявлений. Загрузите JSON-файл в панели управления.</div>
  </main>

  <script>
    const state = { items: [], filtered: [] };
    const rows = document.querySelector("#rows");
    const stats = document.querySelector("#stats");
    const empty = document.querySelector("#empty");
    const tableShell = document.querySelector("#tableShell");
    const q = document.querySelector("#q");
    const grade = document.querySelector("#grade");
    const sort = document.querySelector("#sort");

    load();
    q.addEventListener("input", render);
    grade.addEventListener("change", render);
    sort.addEventListener("change", render);

    async function load() {
      const response = await fetch("/api/listings");
      const data = await response.json();
      state.items = Array.isArray(data.items) ? data.items : [];
      renderStats(data);
      render();
    }

    function renderStats(data) {
      const source = data.sourceFile ? `Файл: ${escapeHtml(data.sourceFile)}` : "Файл не загружен";
      const updated = data.updatedAt ? `Обновлено: ${new Date(data.updatedAt).toLocaleString("ru-RU")}` : "База пока пустая";
      stats.innerHTML = `<span class="pill">Объектов: ${state.items.length}</span><span class="pill">${source}</span><span class="pill">${updated}</span>`;
    }

    function render() {
      const query = q.value.trim().toLowerCase();
      const wantedGrade = grade.value;
      let items = state.items.filter((item) => {
        const haystack = [item.title, item.address, item.metro, item.terms, item.description].join(" ").toLowerCase();
        return (!query || haystack.includes(query)) && (!wantedGrade || item.grade === wantedGrade);
      });

      const sortBy = sort.value;
      if (sortBy === "total") items = items.slice().sort((a, b) => numberOrMax(a.total) - numberOrMax(b.total));
      if (sortBy === "monthly") items = items.slice().sort((a, b) => numberOrMax(a.monthly) - numberOrMax(b.monthly));
      if (sortBy === "score") items = items.slice().sort((a, b) => (b.score || 0) - (a.score || 0));

      rows.innerHTML = items.map(rowTemplate).join("");
      empty.hidden = items.length > 0;
      tableShell.hidden = items.length === 0;
    }

    function rowTemplate(item, index) {
      const grade = item.grade || "-";
      const price = item.monthly ? money(item.monthly) : item.price || "-";
      const link = item.url ? `<a class="openBtn" href="${escapeAttr(item.url)}" target="_blank" rel="noreferrer">Открыть</a>` : "<span class='muted'>Нет ссылки</span>";
      const commute = [item.commuteHome && `Дом: <b>${escapeHtml(item.commuteHome)}</b>`, item.commuteWork && `Работа: <b>${escapeHtml(item.commuteWork)}</b>`].filter(Boolean).join("<br>") || "-";
      return `<tr>
        <td data-label="#"><b>${index + 1}</b></td>
        <td data-label="Оценка"><span class="grade ${escapeAttr(grade)}">${escapeHtml(grade)}</span>${item.score ? `<span class="muted">${item.score}</span>` : ""}</td>
        <td data-label="Объект"><div class="title">${escapeHtml(item.title)}</div><span class="muted">${escapeHtml([item.address, item.metro].filter(Boolean).join(" · "))}</span><span class="muted">${escapeHtml(item.terms)}</span></td>
        <td data-label="Цена" class="money">${escapeHtml(price)}${item.total ? `<span class="muted">Всего: ${money(item.total)}</span>` : ""}</td>
        <td data-label="Залог">${item.deposit ? money(item.deposit) : "-"}</td>
        <td data-label="Комиссия">${item.commission ? money(item.commission) : "-"}</td>
        <td data-label="ЖКУ">${item.utilities ? money(item.utilities) : "-"}</td>
        <td data-label="Дорога">${commute}</td>
        <td data-label="Комментарий">${escapeHtml(shorten(item.description, 180))}</td>
        <td data-label="Ссылка">${link}</td>
      </tr>`;
    }

    function numberOrMax(value) { return Number(value) > 0 ? Number(value) : Number.MAX_SAFE_INTEGER; }
    function money(value) { return `${Number(value).toLocaleString("ru-RU")} ₽`; }
    function shorten(value, limit) { const text = String(value || ""); return text.length > limit ? `${text.slice(0, limit - 1)}…` : text; }
    function escapeHtml(value) { return String(value || "").replace(/[&<>"']/g, (ch) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch])); }
    function escapeAttr(value) { return escapeHtml(value).replace(/`/g, "&#96;"); }
  </script>
</body>
</html>
